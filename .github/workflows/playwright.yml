name: Playwright Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Çalıştırılacak test paketi
        required: true
        default: critical
        type: choice
        options:
          - critical
          - full
      finding_id:
        description: >-
          (WP-R3) Known-bug registry ID (ör. B4). Doldurulursa YALNIZ o bulgu
          forensik modda koşulur; güvenli kanıt paketi üretilir. Boş bırakılırsa
          forensik job atlanır.
        required: false
        type: string
      verify_finding_id:
        description: >-
          (WP-R4) Fixed-candidate DOĞRULAMA için known-bug registry ID (ör. B4).
          Doldurulursa YALNIZ o bulgu için tek bir bağımsız doğrulama koşusu yapılır,
          attestation + verification-report üretilir. Registry DEĞİŞMEZ, finding
          KAPANMAZ (yalnız öneri). Boş bırakılırsa doğrulama job atlanır.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_ENV: ${{ vars.E2E_ENV || 'production' }}
  BASE_URL: ${{ vars.E2E_BASE_URL || 'https://app.vomenta.com' }}
  ALLOW_MUTATING_TESTS: 'false'

jobs:
  architecture:
    name: Architecture and test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # quality:check = generatör MANTIĞININ self-check'leri (git-diff YOK). Her
      # tetikleyicide (PR + push + schedule) koşar; evrensel kapı budur.
      - run: npm run quality:check
      # ── Committed-doc drift kapıları — YALNIZ pull_request ──────────────────
      # Bu 4 kapı üretilen dokümanı yeniden üretip committed sürümle `git diff
      # --exit-code` karşılaştırır. Doküman içeriği BİRLEŞİK AĞACIN fonksiyonudur;
      # iki PR eşzamanlı merge edilince ne biri ne öbürü nihai birleşik ağacı
      # görür → merge commit'inin committed doc'ları kaçınılmaz bayatlar. Bu kapı
      # `push` (merge commit) üzerinde koşarsa main, kimsenin hatası olmayan bir
      # yarıştan ötürü kronik kırmızıya düşer (ADR-0013). Drift YALNIZ PR'da
      # (taban stabil + yazar aksiyon alabilir) anlamlı ve uygulanabilir; bu yüzden
      # kapılar pull_request'e sınırlandı. Push/merge sonrası tazelik, drift'i
      # yakalayan bir sonraki PR'ın regen'iyle kendiliğinden iyileşir.
      - name: Kapsama raporu güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:coverage:check
      - name: Stil kapsama matrisi güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:style-matrix:check
      - name: Bulgu + test raporları güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:findings:check
      - name: Rota kapsam derinliği matrisi güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:surface:check
      - name: Yüzey envanteri güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:surface-inventory:check
      - name: Proje durumu (birleşik rapor) güncel mi (drift kontrolü)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:project-status:check

  pr-impact:
    name: PR change-impact tests / Chromium
    needs: architecture
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # WP-CI-SHARD (ADR-0025): PR change-impact lane'i 3 parçaya (shard) bölünür.
    # Geniş-etkili PR'larda (config/contract/auth-setup → bounded fallback) tek
    # runner + 45-dk kutu canlı 503 dalgasında timeout'a düşüyordu. Her shard kendi
    # kutusunda BİTER; kapsam birleşimde korunur (shardGroups saf bölme + aggregate
    # gate). Kutu 75-dk: shard başına düşen yükün taze-login + kontrollü retry ile
    # güvenli tamamlanması için.
    timeout-minutes: 75
    strategy:
      # Bir shard kırmızı olunca diğerleri iptal edilmez; her parçanın gerçek sonucu
      # ayrı görünür. Aggregate gate (pr-impact-gate) hepsini tek sabit kapıda toplar.
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # Genel retry YOK: kontrollü altyapı-retry runner içinde, yalnız yapılandırılmış
      # 502/503/504 + izin verilen network hatalarında ve EN FAZLA 1 kez yapılır.
      PLAYWRIGHT_RETRIES: 0
      # Shard başına tek worker: canlı sunucu yükü + determinizm.
      PLAYWRIGHT_WORKERS: 1
      # Mutation kaçış bayrağı YOK: üst düzey ALLOW_MUTATING_TESTS='false' korunur.
      # Değişen dosyalardan yalnız ilgili testler seçilir (WP-CI-E2); sabit tek
      # dosya değil. Runner 0-test/flaky/unexpected/mutation-sızmasında kırmızıdır.
    steps:
      - uses: actions/checkout@v4
        with:
          # Değişiklik-etkisi diff'i merge-base gerektirir → tüm geçmiş + base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Değişiklik-etkisi planı üret (deterministik seçici)
        # Base = PR hedef dalı (origin/<base_ref>), Head = PR birleşme SHA'sı.
        # Planner shallow/eksik base'de non-zero verir (fail-closed) → job kırmızı.
        run: node tools/plan-pr-impact.mjs --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"
      - name: Seçilen testleri koş (gerçek runner; gating adım)
        # Runner selection.json'u okur, EXACT spec + fallback gruplarını bu shard için
        # (--shard N/3) Chromium'da koşar. continue-on-error / || true YOK: exit-code
        # job'ı gate eder. Boş shard meşru SHARD_NOOP'tur (exit 0); kapsam birleşimde.
        run: node tools/run-pr-impact.mjs --plan test-results/pr-impact/selection.json --shard ${{ matrix.shard }}/3

  pr-impact-gate:
    # WP-CI-SHARD (ADR-0025): SABİT İSİMLİ aggregate gate. Shard sayısı değişse bile
    # branch protection tek bu kapıyı zorunlu kılar. Tüm pr-impact matris hücreleri
    # yeşil değilse (failure/cancelled/skipped) bu job KIRMIZI olur → merge engellenir.
    name: PR change-impact gate
    needs: pr-impact
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tüm change-impact shard'ları yeşil mi (sabit aggregate kapı)
        env:
          IMPACT_RESULT: ${{ needs.pr-impact.result }}
        run: |
          echo "pr-impact matris sonucu: ${IMPACT_RESULT}"
          if [ "${IMPACT_RESULT}" != "success" ]; then
            echo "::error::PR change-impact shard'ları yeşil değil (${IMPACT_RESULT}); merge engellendi."
            exit 1
          fi
          echo "Tüm change-impact shard'ları başarılı."

  public-smoke:
    name: Public smoke / Chromium
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Güvenli artifact bundle hazırla (public-smoke)
        id: prep_public_smoke
        # Test adımı kırmızı olsa da güvenli özet üretilebilir; ama upload YALNIZ
        # preparer ready=true üretirse çalışır (aşağıdaki step).
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane public-smoke
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_public_smoke.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-secure
          path: test-results/secure-upload/public-smoke/
          if-no-files-found: error
          retention-days: 14

  authenticated-quality:
    name: Authenticated route quality / Chromium
    needs: architecture
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quality:pr
      - name: Güvenli artifact bundle hazırla (authenticated-quality)
        id: prep_auth_quality
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane authenticated-quality
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_auth_quality.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-route-quality-secure
          path: test-results/secure-upload/authenticated-quality/
          if-no-files-found: error
          retention-days: 30

  authenticated-critical:
    name: Critical authenticated / Chromium
    needs: architecture
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'critical')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:critical
      - name: Güvenli artifact bundle hazırla (authenticated-critical)
        id: prep_auth_critical
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane authenticated-critical
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_auth_critical.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-critical-secure
          path: test-results/secure-upload/authenticated-critical/
          if-no-files-found: error
          retention-days: 30

  known-bug-forensic:
    name: Known-bug forensic (manual)
    needs: architecture
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.finding_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # Production read-only. Mutation kaçış bayrağı YOK.
      ALLOW_MUTATING_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kısa SHA
        id: vars
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Forensik koşu + güvenli kanıt paketi
        # report:bug testi forensik modda koşar (beklenen-başarısızlık atlanır),
        # yalnız güvenli upload bundle üretir. Testin kendisi kırmızı olsa da araç
        # başarıyla (exit 0) çıkar; yalnız güvensiz/beklenmeyen dosyada exit 1 verir.
        run: npm run report:bug -- "${{ inputs.finding_id }}"
      - name: Registry değişmedi mi (forensik registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli artifact yükle (YALNIZ upload/ allowlist bundlei)
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-forensic-${{ inputs.finding_id }}-${{ steps.vars.outputs.short }}-${{ github.run_id }}
          path: test-results/findings/${{ inputs.finding_id }}/upload/
          if-no-files-found: error
          retention-days: 14

  known-bug-verify:
    name: Known-bug fix verification (manual)
    needs: architecture
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_finding_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # WP-R4 takip düzeltmesi (restore-403): cross-run attestation restore adımı
    # GITHUB_TOKEN ile `actions/artifacts` REST listesini sorgular; bu çağrı
    # `actions: read` ister. Üst düzey tek başına `contents: read` verildiğinden
    # liste 403 döndü ve restore HİÇBİR önceki v2 attestation'ı getiremedi (seri
    # birikimi + namespace izolasyonu canlı doğrulanamadı). En dar kapsam: yalnız
    # bu job'a `actions: read` (checkout için `contents: read` korunur).
    permissions:
      contents: read
      actions: read
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      ALLOW_MUTATING_TESTS: 'false'
      # CI'da auth.setup her koşuda taze login üretir → bağımsız-koşu kriteri için freshLogin=true.
      VERIFY_FRESH_SESSION: 'true'
      FID: ${{ inputs.verify_finding_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kısa SHA
        id: vars
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Önceki attestation'ları geri yükle (best-effort; seri günlere yayılsın)
        # Seri (≥3 koşu / ≥2 gün) ayrı dispatch koşularına yayıldığından, önceki
        # `known-bug-verification-v2-<id>-*` artifact'lerindeki attestation'ları toplarız.
        # v2 NAMESPACE: WP-R4-öncesi/eski `known-bug-verify-*` (non-deterministik fingerprint)
        # artifact'leri restore aramasına HİÇ girmez. Ayrıca aggregate uyumluluk kapısı
        # (schemaVersion/profileContractVersion) eski kayıtları yine de yok sayar (defense-in-depth).
        # Tamamen best-effort: başarısız olsa da bu koşu kendi attestation'ını üretir.
        run: |
          set +e
          mkdir -p "test-results/findings/${FID}/verification/attestations"
          # Liste çağrısı `actions: read` ister (job-level permissions ile verildi).
          # Hata ARTIK gizlenmez: ham yanıt yakalanır, exit-code kontrol edilir, geçici
          # hataya karşı birkaç kez denenir ve tanılama `::warning::` olarak yazdırılır.
          # (Önceki sürüm `--jq ... 2>/dev/null` ile 403 gövdesini $ids'e sızdırıyordu →
          #  restore sessizce 0 döndürüyordu; kök neden görünmüyordu.)
          ids=""
          for attempt in 1 2 3; do
            resp=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" 2>/tmp/artifacts-list.err)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ids=$(printf '%s' "$resp" | jq -r ".artifacts[] | select(.expired==false) | select(.name | startswith(\"known-bug-verification-v2-${FID}-\")) | .id" | head -30)
              break
            fi
            echo "::warning::artifacts listesi denemesi ${attempt}/3 başarısız (rc=${rc}): $(cat /tmp/artifacts-list.err 2>/dev/null)"
            sleep 5
          done
          for aid in $ids; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > "/tmp/att-$aid.zip" 2>/dev/null || continue
            unzip -o -qq "/tmp/att-$aid.zip" -d "/tmp/att-$aid" 2>/dev/null || continue
            find "/tmp/att-$aid" -name 'attestation-*.json' -exec cp {} "test-results/findings/${FID}/verification/attestations/" \; 2>/dev/null
          done
          echo "geri yüklenen attestation: $(ls test-results/findings/${FID}/verification/attestations/ 2>/dev/null | wc -l)"
          exit 0
      - name: Doğrulama koşusu + toplama (registry DEĞİŞMEZ; finding KAPANMAZ)
        # report:verify tek bağımsız koşu yapar, attestation üretir, tüm attestation'ları
        # eşiğe göre birleştirir. verified-fixed-proposal bile YALNIZ öneridir.
        # Hedef testte mutation method görülürse güvenli bundle yazılır AMA exit 1 (policy gate).
        run: npm run report:verify -- "${FID}"
      - name: Registry değişmedi mi (doğrulama registrye YAZMAZ)
        # Policy violation'da bile registry kontrolü + güvenli bundle upload'ı çalışsın.
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli doğrulama artifact'i yükle (YALNIZ upload/ allowlist bundlei)
        # Policy violation'da bundle YİNE yüklenir (kanıt korunur); job yine kırmızı kalır.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-verification-v2-${{ inputs.verify_finding_id }}-${{ steps.vars.outputs.short }}-${{ github.run_id }}
          path: test-results/findings/${{ inputs.verify_finding_id }}/verification/upload/
          if-no-files-found: error
          retention-days: 30

  full-regression:
    name: Full cross-browser regression
    needs: architecture
    # FAZ 1 CONTAINMENT (run 30890308492): `schedule` tetikleyicisinden ÇIKARILDI.
    # Gecelik cron artık 6 hücreli (3 tarayıcı × 2 shard) full authenticated matrisi
    # otomatik başlatamaz. Yalnız manuel `workflow_dispatch` + suite=full ile koşar.
    # Kalıcı ayrım (nightly-functional.yml) Faz 2'de yapılacak.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    # Ortak production authenticated kilidi — aynı anda YALNIZ tek ağır authenticated
    # job koşar; kalanlar iptal edilmeden bu grupta SIRAYA girer.
    # `queue: max` (GitHub Actions concurrency): grupta 100'e kadar pending iş bekletir;
    # `single` (varsayılan) olsaydı yalnız 1 pending tutulur, sonraki gelen öncekini
    # iptal ederdi → manuel suite=full'daki 11 job garanti sırayla koşmazdı. `queue: max`
    # ile hepsi sırayla koşar. `cancel-in-progress: true` bu değerle BİRLİKTE KULLANILAMAZ
    # (validation hatası); burada belirtilmez (koşan iş iptal edilmez).
    concurrency:
      group: vomenta-production-authenticated-e2e
      queue: max
    runs-on: ubuntu-latest
    # WP-NIGHT-STABILITY (ADR-0017): 3854 test (authed 1275 × 3 tarayıcı) tek
    # runner + 45dk kutuya sığmıyordu → her gece timeout'ta cancelled. Çözüm:
    # tarayıcı × parça (shard) matrisi. Her hücre kendi kutusunda BİTER; kapsam
    # korunur. Kutu 45→60: shard başına düşen yükün güvenli tamamlanması için.
    timeout-minutes: 60
    strategy:
      # Bir tarayıcı/parça kırmızı olunca diğerleri iptal edilmez; her tarayıcının
      # gerçek sonucu ayrı görünür (handoff §7.5: browser bazlı sonuçlar ayrı).
      fail-fast: false
      matrix:
        browser: [chromium-authed, firefox-authed, webkit-authed]
        shard: [1, 2]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      PLAYWRIGHT_WORKERS: 2
      # retries 2→1: her başarısızlık maliyeti 3x→2x. failOnFlakyTests korunur →
      # retry'da geçen test PASS değil FLAKY olarak run'ı kırar (handoff §7.4).
      PLAYWRIGHT_RETRIES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Shard koşumu (tarayıcı × parça; kapsam korunur, retry-pass FLAKY kalır)
        # --project=<browser>-authed setup dependency'sini + storageState'i otomatik
        # koşar (playwright.config.js:132-149). --shard testleri parçaya böler.
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Güvenli artifact bundle hazırla (full-regression)
        id: prep_full
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane full-regression
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_full.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # Matris hücresi başına benzersiz ad (v4 aynı-ad çakışmasını önler); path
          # aynı güvenli lane'de kalır → allowlist lane kaydı değişmez.
          name: full-regression-secure-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/secure-upload/full-regression/
          if-no-files-found: error
          retention-days: 30

  visual-regression:
    name: Visual regression / macOS
    needs: architecture
    # FAZ 1 CONTAINMENT: `schedule`'dan çıkarıldı; gecelik cron 3 tarayıcı visual
    # matrisini otomatik başlatamaz. Yalnız manuel workflow_dispatch + suite=full.
    # Kalıcı haftalık ayrım (weekly-visual.yml) Faz 6'da.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    # Ortak production authenticated kilidi (bkz. full-regression notu — queue:max ile
    # grupta sıraya girer, koşan iş iptal edilmez).
    concurrency:
      group: vomenta-production-authenticated-e2e
      queue: max
    runs-on: macos-14
    # WP-NIGHT-STABILITY (ADR-0017): 64 @visual test tek koşumda 30dk kutuya
    # sığmayıp cancelled oluyordu. Tarayıcı bazlı ayrılınca her hücre küçülür ve
    # tarayıcı sonucu ayrı görünür. Kutu 30dk korunur (hücre başına ~21 test).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-authed, firefox-authed, webkit-authed]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      RUN_VISUAL_TESTS: 'true'
      PLAYWRIGHT_RETRIES: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - name: Görsel koşum (tarayıcı bazlı ayrı)
        run: npm run test:visual -- --project=${{ matrix.browser }}
      - name: Güvenli artifact bundle hazırla (visual-regression)
        id: prep_visual
        # Görsel diff PNG'leri canlı müşteri verisi taşıyabilir → raw upload DENY.
        # Yalnız güvenli sayısal/test özeti + manifest yüklenir.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane visual-regression
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_visual.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-secure-${{ matrix.browser }}
          path: test-results/secure-upload/visual-regression/
          if-no-files-found: error
          retention-days: 30

  read-only-discovery:
    name: Read-only route discovery
    needs: architecture
    # FAZ 1: Discovery TEK authenticated lane olarak schedule'da KALABİLİR (handoff
    # §Faz 1). Böylece gecelik cron = architecture + public-smoke + tek discovery job;
    # 11'li fırtına yok. Ancak ortak production kilidine alınır (aşağıda). Circuit
    # breaker stabilizasyonu Faz 4'te.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    # Ortak production authenticated kilidi (bkz. full-regression notu — queue:max ile
    # grupta sıraya girer, koşan iş iptal edilmez).
    concurrency:
      group: vomenta-production-authenticated-e2e
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      DISCOVERY_MAX_PAGES: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:discovery
      - name: Güvenli artifact bundle hazırla (read-only-discovery)
        id: prep_discovery
        # Ham discovery/test-results yüklenmez; güvenli sayısal/test özeti + manifest.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane read-only-discovery
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_discovery.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: read-only-discovery-secure
          path: test-results/secure-upload/read-only-discovery/
          if-no-files-found: error
          retention-days: 30

  nightly-known-bug-reconcile:
    name: Nightly known-bug reconcile (fixed-candidate önerisi)
    needs: architecture
    # FAZ 1 CONTAINMENT: `schedule`'dan çıkarıldı. Bu job tüm chromium-authed suite'i
    # (`--project=chromium-authed --reporter=json`) yeniden koştuğu için en ağır
    # yüklerden biriydi. Yalnız manuel workflow_dispatch + suite=full. Hedefli seçim
    # (yalnız known-bug testleri) Faz 5'te; kalıcı ayrım (nightly-known-bugs.yml) Faz 2.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    # Ortak production authenticated kilidi (bkz. full-regression notu — queue:max ile
    # grupta sıraya girer, koşan iş iptal edilmez).
    concurrency:
      group: vomenta-production-authenticated-e2e
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      ALLOW_MUTATING_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Authed suite (JSON rapor) — known-bug sonuçlarını topla
        # `|| true`: beklenen-başarısızlıklar geçer (exit 0); beklenmedik GEÇİŞ ise
        # koşuyu kırar (exit != 0) — reconcile'ın yakalaması gerektiği için devam et.
        run: |
          mkdir -p test-results
          npx playwright test --project=chromium-authed --reporter=json > test-results/results.json || true
      - name: Reconcile — YALNIZ fixed-candidate önerisi (registry değişmez)
        run: npm run report:reconcile -- test-results/results.json
      - name: Registry değişmedi mi (nightly registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli artifact bundle hazırla (nightly-known-bug-reconcile)
        id: prep_reconcile
        # fixed-candidates.json ortak politikadan geçer: şema (candidates[]/registryChanged=false)
        # + secret/PII taraması + manifest. Ham test-results yüklenmez.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane nightly-known-bug-reconcile
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Öneri raporunu yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_reconcile.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-fixed-candidates-${{ github.run_id }}
          path: test-results/secure-upload/nightly-known-bug-reconcile/
          if-no-files-found: error
          retention-days: 14
