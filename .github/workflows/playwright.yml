name: Playwright Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Çalıştırılacak test paketi
        required: true
        default: critical
        type: choice
        options:
          - critical
          - full
      finding_id:
        description: >-
          (WP-R3) Known-bug registry ID (ör. B4). Doldurulursa YALNIZ o bulgu
          forensik modda koşulur; güvenli kanıt paketi üretilir. Boş bırakılırsa
          forensik job atlanır.
        required: false
        type: string
      verify_finding_id:
        description: >-
          (WP-R4) Fixed-candidate DOĞRULAMA için known-bug registry ID (ör. B4).
          Doldurulursa YALNIZ o bulgu için tek bir bağımsız doğrulama koşusu yapılır,
          attestation + verification-report üretilir. Registry DEĞİŞMEZ, finding
          KAPANMAZ (yalnız öneri). Boş bırakılırsa doğrulama job atlanır.
        required: false
        type: string
      collect_evidence:
        description: >-
          (WP-EVIDENCE FAZ 3) Açık knownBugGuard bulguları için OTOMATİK kanıt
          lane'ini elle tetikler. Bounded/serileştirilmiş forensik koşum → maskeli
          bundle'lar + docs/raporlar/evidence-index.json (COMMIT önerisi artifact
          olarak yüklenir; registry DEĞİŞMEZ). Nightly (schedule) zaten koşar.
        required: false
        default: false
        type: boolean
      evidence_max_findings:
        description: >-
          (WP-EVIDENCE FAZ 3) Kanıt lane'inin işleyeceği açık bulgu üst sınırı
          (bounded; tek prod hesabı yükü). Boş → varsayılan (12).
        required: false
        type: string
      update_discovery_baseline:
        description: >-
          (CI-03/discovery) Discovery baseline'ını mevcut içerik-yakalayan crawler
          ile CANLI prod'a karşı YENİDEN ÜRET. drift kapısı bu modda UYGULANMAZ;
          yenilenen tests/contracts/discovery-baseline.json COMMIT ÖNERİSİ artifact
          olarak yüklenir (main'e otomatik push YOK — read-only ethos). Baseline
          gerçek prod creds gerektirir; local .env placeholder olduğundan yerelde
          üretilemez. Boş/false → job atlanır.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_ENV: ${{ vars.E2E_ENV || 'production' }}
  BASE_URL: ${{ vars.E2E_BASE_URL || 'https://app.vomenta.com' }}
  ALLOW_MUTATING_TESTS: 'false'

jobs:
  architecture:
    name: Architecture and test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # quality:check = generatör MANTIĞININ self-check'leri (git-diff YOK). Her
      # tetikleyicide (PR + push + schedule) koşar; evrensel kapı budur.
      - run: npm run quality:check
      # REP-01: Açık bulgu envanteri HER tetikleyicide birinci-sınıf, görünür bir adım
      # olarak basılır ("N açık: X kritik / Y yüksek …") + ratchet (açık sayı baseline
      # tavanını aşarsa fail → sessiz büyüme yasak). quality:check içinde de zorlanır;
      # bu ayrı adım GitHub Actions UI'da görünürlüğü garantiler.
      - name: Açık bulgu envanteri + ratchet (REP-01)
        run: npm run quality:findings-ratchet
      # ── Committed-doc drift kapıları — YALNIZ pull_request ──────────────────
      # Bu 4 kapı üretilen dokümanı yeniden üretip committed sürümle `git diff
      # --exit-code` karşılaştırır. Doküman içeriği BİRLEŞİK AĞACIN fonksiyonudur;
      # iki PR eşzamanlı merge edilince ne biri ne öbürü nihai birleşik ağacı
      # görür → merge commit'inin committed doc'ları kaçınılmaz bayatlar. Bu kapı
      # `push` (merge commit) üzerinde koşarsa main, kimsenin hatası olmayan bir
      # yarıştan ötürü kronik kırmızıya düşer (ADR-0013). Drift YALNIZ PR'da
      # (taban stabil + yazar aksiyon alabilir) anlamlı ve uygulanabilir; bu yüzden
      # kapılar pull_request'e sınırlandı. Push/merge sonrası tazelik, drift'i
      # yakalayan bir sonraki PR'ın regen'iyle kendiliğinden iyileşir.
      # WP-CI-DRIFT (CI-04): 6 ayrı drift kapısı TEK deterministik kapıya indirildi.
      # `report:sync` gated üretilmiş dokümanların HEPSİNİ tek komutta yeniden üretir;
      # ardından committed sürümle `git diff --exit-code` karşılaştırılır. Tek düzeltme:
      # `npm run report:sync` + commit. Eski `report:all` coverage+findings'i ATLADIĞI
      # için "report:all → commit → yine kırmızı" whack-a-mole'u oluşuyordu (CI-04);
      # report:sync 6 dokümanın (12 dosya) tümünü kapsar. Generator'lar deterministik
      # (generatedAt=null, BIT-IDENTICAL) → tek regen kalıcı yeşil, ikincil döngü yok.
      - name: Üretilmiş raporlar güncel mi (tek drift kapısı)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:drift:check

  pr-impact:
    name: PR change-impact tests / Chromium
    needs: architecture
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # WP-CI-SHARD (ADR-0025): PR change-impact lane'i 3 parçaya (shard) bölünür.
    # Geniş-etkili PR'larda (config/contract/auth-setup → bounded fallback) tek
    # runner + 45-dk kutu canlı 503 dalgasında timeout'a düşüyordu. Her shard kendi
    # kutusunda BİTER; kapsam birleşimde korunur (shardGroups saf bölme + aggregate
    # gate). Kutu 75-dk: shard başına düşen yükün taze-login + kontrollü retry ile
    # güvenli tamamlanması için.
    timeout-minutes: 75
    strategy:
      # Bir shard kırmızı olunca diğerleri iptal edilmez; her parçanın gerçek sonucu
      # ayrı görünür. Aggregate gate (pr-impact-gate) hepsini tek sabit kapıda toplar.
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # Genel retry YOK: kontrollü altyapı-retry runner içinde, yalnız yapılandırılmış
      # 502/503/504 + izin verilen network hatalarında ve EN FAZLA 1 kez yapılır.
      PLAYWRIGHT_RETRIES: 0
      # Shard başına tek worker: canlı sunucu yükü + determinizm.
      PLAYWRIGHT_WORKERS: 1
      # Mutation kaçış bayrağı YOK: üst düzey ALLOW_MUTATING_TESTS='false' korunur.
      # Değişen dosyalardan yalnız ilgili testler seçilir (WP-CI-E2); sabit tek
      # dosya değil. Runner 0-test/flaky/unexpected/mutation-sızmasında kırmızıdır.
    steps:
      - uses: actions/checkout@v4
        with:
          # Değişiklik-etkisi diff'i merge-base gerektirir → tüm geçmiş + base ref.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Değişiklik-etkisi planı üret (deterministik seçici)
        # Base = PR hedef dalı (origin/<base_ref>), Head = PR birleşme SHA'sı.
        # Planner shallow/eksik base'de non-zero verir (fail-closed) → job kırmızı.
        run: node tools/plan-pr-impact.mjs --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"
      - name: Seçilen testleri koş (gerçek runner; gating adım)
        # Runner selection.json'u okur, EXACT spec + fallback gruplarını bu shard için
        # (--shard N/3) Chromium'da koşar. continue-on-error / || true YOK: exit-code
        # job'ı gate eder. Boş shard meşru SHARD_NOOP'tur (exit 0); kapsam birleşimde.
        run: node tools/run-pr-impact.mjs --plan test-results/pr-impact/selection.json --shard ${{ matrix.shard }}/3

  pr-impact-gate:
    # WP-CI-SHARD (ADR-0025): SABİT İSİMLİ aggregate gate. Shard sayısı değişse bile
    # branch protection tek bu kapıyı zorunlu kılar. Tüm pr-impact matris hücreleri
    # yeşil değilse (failure/cancelled/skipped) bu job KIRMIZI olur → merge engellenir.
    name: PR change-impact gate
    needs: pr-impact
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tüm change-impact shard'ları yeşil mi (sabit aggregate kapı)
        env:
          IMPACT_RESULT: ${{ needs.pr-impact.result }}
        run: |
          echo "pr-impact matris sonucu: ${IMPACT_RESULT}"
          if [ "${IMPACT_RESULT}" != "success" ]; then
            echo "::error::PR change-impact shard'ları yeşil değil (${IMPACT_RESULT}); merge engellendi."
            exit 1
          fi
          echo "Tüm change-impact shard'ları başarılı."

  public-smoke:
    name: Public smoke / Chromium
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Güvenli artifact bundle hazırla (public-smoke)
        id: prep_public_smoke
        # Test adımı kırmızı olsa da güvenli özet üretilebilir; ama upload YALNIZ
        # preparer ready=true üretirse çalışır (aşağıdaki step).
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane public-smoke
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_public_smoke.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-secure
          path: test-results/secure-upload/public-smoke/
          if-no-files-found: error
          retention-days: 14

  authenticated-quality:
    name: Authenticated route quality / Chromium
    needs: architecture
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quality:pr
      - name: Güvenli artifact bundle hazırla (authenticated-quality)
        id: prep_auth_quality
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane authenticated-quality
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_auth_quality.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-route-quality-secure
          path: test-results/secure-upload/authenticated-quality/
          if-no-files-found: error
          retention-days: 30

  authenticated-critical:
    name: Critical authenticated / Chromium
    needs: architecture
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'critical')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:critical
      - name: Güvenli artifact bundle hazırla (authenticated-critical)
        id: prep_auth_critical
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane authenticated-critical
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_auth_critical.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-critical-secure
          path: test-results/secure-upload/authenticated-critical/
          if-no-files-found: error
          retention-days: 30

  known-bug-forensic:
    name: Known-bug forensic (manual)
    needs: architecture
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.finding_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # Production read-only. Mutation kaçış bayrağı YOK.
      ALLOW_MUTATING_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kısa SHA
        id: vars
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Forensik koşu + güvenli kanıt paketi
        # report:bug testi forensik modda koşar (beklenen-başarısızlık atlanır),
        # yalnız güvenli upload bundle üretir. Testin kendisi kırmızı olsa da araç
        # başarıyla (exit 0) çıkar; yalnız güvensiz/beklenmeyen dosyada exit 1 verir.
        run: npm run report:bug -- "${{ inputs.finding_id }}"
      - name: Registry değişmedi mi (forensik registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli artifact yükle (YALNIZ upload/ allowlist bundlei)
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-forensic-${{ inputs.finding_id }}-${{ steps.vars.outputs.short }}-${{ github.run_id }}
          path: test-results/findings/${{ inputs.finding_id }}/upload/
          if-no-files-found: error
          # ADR-0026 §5: kanıt artifact'i ≥30 gün (evidence-index.json expiry ile hizalı).
          retention-days: 30

  known-bug-verify:
    name: Known-bug fix verification (manual)
    needs: architecture
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_finding_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # WP-R4 takip düzeltmesi (restore-403): cross-run attestation restore adımı
    # GITHUB_TOKEN ile `actions/artifacts` REST listesini sorgular; bu çağrı
    # `actions: read` ister. Üst düzey tek başına `contents: read` verildiğinden
    # liste 403 döndü ve restore HİÇBİR önceki v2 attestation'ı getiremedi (seri
    # birikimi + namespace izolasyonu canlı doğrulanamadı). En dar kapsam: yalnız
    # bu job'a `actions: read` (checkout için `contents: read` korunur).
    permissions:
      contents: read
      actions: read
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      ALLOW_MUTATING_TESTS: 'false'
      # CI'da auth.setup her koşuda taze login üretir → bağımsız-koşu kriteri için freshLogin=true.
      VERIFY_FRESH_SESSION: 'true'
      FID: ${{ inputs.verify_finding_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kısa SHA
        id: vars
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Önceki attestation'ları geri yükle (best-effort; seri günlere yayılsın)
        # Seri (≥3 koşu / ≥2 gün) ayrı dispatch koşularına yayıldığından, önceki
        # `known-bug-verification-v2-<id>-*` artifact'lerindeki attestation'ları toplarız.
        # v2 NAMESPACE: WP-R4-öncesi/eski `known-bug-verify-*` (non-deterministik fingerprint)
        # artifact'leri restore aramasına HİÇ girmez. Ayrıca aggregate uyumluluk kapısı
        # (schemaVersion/profileContractVersion) eski kayıtları yine de yok sayar (defense-in-depth).
        # Tamamen best-effort: başarısız olsa da bu koşu kendi attestation'ını üretir.
        run: |
          set +e
          mkdir -p "test-results/findings/${FID}/verification/attestations"
          # Liste çağrısı `actions: read` ister (job-level permissions ile verildi).
          # Hata ARTIK gizlenmez: ham yanıt yakalanır, exit-code kontrol edilir, geçici
          # hataya karşı birkaç kez denenir ve tanılama `::warning::` olarak yazdırılır.
          # (Önceki sürüm `--jq ... 2>/dev/null` ile 403 gövdesini $ids'e sızdırıyordu →
          #  restore sessizce 0 döndürüyordu; kök neden görünmüyordu.)
          ids=""
          for attempt in 1 2 3; do
            resp=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" 2>/tmp/artifacts-list.err)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ids=$(printf '%s' "$resp" | jq -r ".artifacts[] | select(.expired==false) | select(.name | startswith(\"known-bug-verification-v2-${FID}-\")) | .id" | head -30)
              break
            fi
            echo "::warning::artifacts listesi denemesi ${attempt}/3 başarısız (rc=${rc}): $(cat /tmp/artifacts-list.err 2>/dev/null)"
            sleep 5
          done
          for aid in $ids; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > "/tmp/att-$aid.zip" 2>/dev/null || continue
            unzip -o -qq "/tmp/att-$aid.zip" -d "/tmp/att-$aid" 2>/dev/null || continue
            find "/tmp/att-$aid" -name 'attestation-*.json' -exec cp {} "test-results/findings/${FID}/verification/attestations/" \; 2>/dev/null
          done
          echo "geri yüklenen attestation: $(ls test-results/findings/${FID}/verification/attestations/ 2>/dev/null | wc -l)"
          exit 0
      - name: Doğrulama koşusu + toplama (registry DEĞİŞMEZ; finding KAPANMAZ)
        # report:verify tek bağımsız koşu yapar, attestation üretir, tüm attestation'ları
        # eşiğe göre birleştirir. verified-fixed-proposal bile YALNIZ öneridir.
        # Hedef testte mutation method görülürse güvenli bundle yazılır AMA exit 1 (policy gate).
        run: npm run report:verify -- "${FID}"
      - name: Registry değişmedi mi (doğrulama registrye YAZMAZ)
        # Policy violation'da bile registry kontrolü + güvenli bundle upload'ı çalışsın.
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli doğrulama artifact'i yükle (YALNIZ upload/ allowlist bundlei)
        # Policy violation'da bundle YİNE yüklenir (kanıt korunur); job yine kırmızı kalır.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-verification-v2-${{ inputs.verify_finding_id }}-${{ steps.vars.outputs.short }}-${{ github.run_id }}
          path: test-results/findings/${{ inputs.verify_finding_id }}/verification/upload/
          if-no-files-found: error
          retention-days: 30

  full-regression:
    name: Full cross-browser regression
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    # WP-NIGHT-STABILITY (ADR-0017): 3854 test (authed 1275 × 3 tarayıcı) tek
    # runner + 45dk kutuya sığmıyordu → her gece timeout'ta cancelled. Çözüm:
    # tarayıcı × parça (shard) matrisi. Her hücre kendi kutusunda BİTER; kapsam
    # korunur. Kutu 45→60: shard başına düşen yükün güvenli tamamlanması için.
    timeout-minutes: 60
    strategy:
      # Bir tarayıcı/parça kırmızı olunca diğerleri iptal edilmez; her tarayıcının
      # gerçek sonucu ayrı görünür (handoff §7.5: browser bazlı sonuçlar ayrı).
      fail-fast: false
      matrix:
        browser: [chromium-authed, firefox-authed, webkit-authed]
        shard: [1, 2]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      PLAYWRIGHT_WORKERS: 2
      # retries 2→1: her başarısızlık maliyeti 3x→2x. failOnFlakyTests korunur →
      # retry'da geçen test PASS değil FLAKY olarak run'ı kırar (handoff §7.4).
      PLAYWRIGHT_RETRIES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Shard koşumu (tarayıcı × parça; kapsam korunur, retry-pass FLAKY kalır)
        # --project=<browser>-authed setup dependency'sini + storageState'i otomatik
        # koşar (playwright.config.js:132-149). --shard testleri parçaya böler.
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Güvenli artifact bundle hazırla (full-regression)
        id: prep_full
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane full-regression
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_full.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # Matris hücresi başına benzersiz ad (v4 aynı-ad çakışmasını önler); path
          # aynı güvenli lane'de kalır → allowlist lane kaydı değişmez.
          name: full-regression-secure-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/secure-upload/full-regression/
          if-no-files-found: error
          retention-days: 30

  visual-regression:
    name: Visual regression / macOS
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: macos-14
    # WP-NIGHT-STABILITY (ADR-0017): 64 @visual test tek koşumda 30dk kutuya
    # sığmayıp cancelled oluyordu. Tarayıcı bazlı ayrılınca her hücre küçülür ve
    # tarayıcı sonucu ayrı görünür. Kutu 30dk korunur (hücre başına ~21 test).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-authed, firefox-authed, webkit-authed]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      RUN_VISUAL_TESTS: 'true'
      PLAYWRIGHT_RETRIES: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - name: Görsel koşum (tarayıcı bazlı ayrı)
        run: npm run test:visual -- --project=${{ matrix.browser }}
      - name: Güvenli artifact bundle hazırla (visual-regression)
        id: prep_visual
        # Görsel diff PNG'leri canlı müşteri verisi taşıyabilir → raw upload DENY.
        # Yalnız güvenli sayısal/test özeti + manifest yüklenir.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane visual-regression
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_visual.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-secure-${{ matrix.browser }}
          path: test-results/secure-upload/visual-regression/
          if-no-files-found: error
          retention-days: 30

  read-only-discovery:
    name: Read-only route discovery
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      DISCOVERY_MAX_PAGES: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:discovery
      - name: Güvenli artifact bundle hazırla (read-only-discovery)
        id: prep_discovery
        # Ham discovery/test-results yüklenmez; güvenli sayısal/test özeti + manifest.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane read-only-discovery
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_discovery.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: read-only-discovery-secure
          path: test-results/secure-upload/read-only-discovery/
          if-no-files-found: error
          retention-days: 30

  # CI-03/discovery — Baseline'ı CANLI prod'a karşı yeniden üretip COMMIT ÖNERİSİ
  # olarak sunan ELLE tetiklenen job (workflow_dispatch + update_discovery_baseline).
  # NEDEN: baseline gerçek prod creds gerektirir (secrets.VOMENTA_*); local .env
  # placeholder olduğundan yerelde `test:discovery:update-baseline` çalıştırılamaz.
  # Bu job baseline'ı yeniler, diff'i job özetine yazar ve yenilenen dosyayı güvenli
  # bundle (discovery-baseline lane) olarak yükler. main'e OTOMATİK PUSH YOK:
  # maintainer artifact'i indirip gözden geçirerek commit eder (read-only ethos).
  discovery-baseline-refresh:
    name: Discovery baseline refresh (COMMIT önerisi; otomatik push YOK)
    needs: architecture
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.update_discovery_baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # maxPages EN SIKI gating koşumuyla (PR change-impact `test:discovery` = 40)
      # HİZALI olmalı. Seed evreni (~66 rota) her maxPages'te TAM gezilir; maxPages
      # yalnız seed-DIŞI keşfedilen ek rotaları sınırlar. 80 ile üretilen bir baseline'a
      # seed-dışı bir rota girerse, 40-run ona ulaşamaz → removed-route → yanlış FAIL.
      # Bu yüzden 40: nightly (80) fazladan rota görürse addedRoutes=info (pass).
      DISCOVERY_MAX_PAGES: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Baseline'ı mevcut içerik-yakalayan crawler ile YENİDEN ÜRET. update-baseline
      # modunda drift kapısı UYGULANMAZ; yalnız hardFailures boşsa baseline yazılır
      # (bozuk keşif referans olarak yazılmaz — bkz. discovery.spec.js).
      - run: npm run test:discovery:update-baseline
      # Yenilenen baseline ile önceki (committed) hali arasındaki farkı job özetine yaz.
      - name: Baseline diff'ini job özetine yaz
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Discovery baseline diff (öneri)';
            echo '';
            echo '```diff';
            git --no-pager diff -- tests/contracts/discovery-baseline.json;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Güvenli baseline bundle hazırla (discovery-baseline lane)
        id: prep_baseline
        # Ham test-results yüklenmez; yalnız şema-doğrulanmış + kanonik baseline kopyası.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane discovery-baseline
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Yenilenen baseline'ı yükle (COMMIT önerisi; YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_baseline.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-baseline-refresh-${{ github.run_id }}
          path: test-results/secure-upload/discovery-baseline/
          if-no-files-found: error
          retention-days: 30

  nightly-known-bug-reconcile:
    name: Nightly known-bug reconcile (fixed-candidate önerisi)
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      ALLOW_MUTATING_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Authed suite (JSON rapor) — known-bug sonuçlarını topla
        # `|| true`: beklenen-başarısızlıklar geçer (exit 0); beklenmedik GEÇİŞ ise
        # koşuyu kırar (exit != 0) — reconcile'ın yakalaması gerektiği için devam et.
        run: |
          mkdir -p test-results
          npx playwright test --project=chromium-authed --reporter=json > test-results/results.json || true
      - name: Reconcile — YALNIZ fixed-candidate önerisi (registry değişmez)
        run: npm run report:reconcile -- test-results/results.json
      - name: Registry değişmedi mi (nightly registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli artifact bundle hazırla (nightly-known-bug-reconcile)
        id: prep_reconcile
        # fixed-candidates.json ortak politikadan geçer: şema (candidates[]/registryChanged=false)
        # + secret/PII taraması + manifest. Ham test-results yüklenmez.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane nightly-known-bug-reconcile
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Öneri raporunu yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_reconcile.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-fixed-candidates-${{ github.run_id }}
          path: test-results/secure-upload/nightly-known-bug-reconcile/
          if-no-files-found: error
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # WP-DRAFT — Otomatik TASLAK bulgu önerisi (report:draft).
  # Authed suite JSON'unu triyaj eder; YALNIZ REAL-RED için taslak iskeleti üretir.
  # Registry'ye YAZMAZ (diff-guard), kök-neden UYDURMAZ. Yüklenen tek şey aggregate
  # draft-summary (safe-summary@1); tekil taslak gövdeleri local/forensik kalır.
  # Tetik: nightly (schedule) + manuel (suite=full). PR başına DEĞİL.
  # ════════════════════════════════════════════════════════════════════════════
  nightly-draft-findings:
    name: Nightly draft findings (REAL-RED önerisi)
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      ALLOW_MUTATING_TESTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Authed suite (JSON rapor) — tüm sonuçları topla
        # `|| true`: beklenen-başarısızlıklar geçer; gerçek kırmızıları report:draft
        # yakalaması gerektiği için exit koduna bakılmaksızın devam edilir.
        run: |
          mkdir -p test-results
          npx playwright test --project=chromium-authed --reporter=json > test-results/report.json || true
      - name: Taslak üret — YALNIZ REAL-RED önerisi (registry değişmez)
        env:
          DRAFT_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: npm run report:draft -- test-results/report.json
      - name: Registry değişmedi mi (taslak üreteci registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli artifact bundle hazırla (known-bug-draft)
        id: prep_draft
        # draft-summary.json ortak politikadan geçer: şema (counts + kök-neden yasağı)
        # + secret/PII taraması + manifest. Ham test-results / tekil taslaklar yüklenmez.
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane known-bug-draft
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Öneri özetini yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_draft.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: draft-findings-${{ github.run_id }}
          path: test-results/secure-upload/known-bug-draft/
          if-no-files-found: error
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════════════
  # WP-EVIDENCE FAZ 3 (ADR-0026) — Otomatik kanıt lane'i.
  # Açık knownBugGuard bulguları için forensik modda BOUNDED (bulgu başına tek test,
  # retry storm yok, max-parallel:1 = serileştir → tek prod hesabı yükü) koşar; maskeli
  # güvenli bundle'ları yükler ve docs/raporlar/evidence-index.json köprü dosyasını
  # üretir. Tetik: nightly (schedule) + manuel (collect_evidence). PR başına DEĞİL.
  # Registry root-cause'una DOKUNMAZ; trace LOCAL-ONLY; production read-only.
  # ════════════════════════════════════════════════════════════════════════════
  evidence-plan:
    name: Evidence plan (açık knownBugGuard bulguları)
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.collect_evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      findings: ${{ steps.list.outputs.findings }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Açık bulgu listesini üret (bounded matrix kaynağı)
        id: list
        env:
          # Boş (schedule) → varsayılan sınır (12). Manuel dispatch override edebilir.
          EVIDENCE_MAX_FINDINGS: ${{ inputs.evidence_max_findings }}
        run: |
          FINDINGS="$(node tools/list-open-findings.mjs --json)"
          COUNT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "${FINDINGS}")"
          echo "findings=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Kanıt lane'i işlenecek açık bulgu sayısı: ${COUNT} → ${FINDINGS}"

  known-bug-evidence:
    name: Known-bug evidence (bounded/serileştirilmiş forensik)
    needs: evidence-plan
    if: ${{ needs.evidence-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Bir bulgu kırmızı olsa (flaky/infra) diğerleri iptal edilmez; index kalan
      # gerçek kanıtlardan dürüstçe üretilir.
      fail-fast: false
      # Tek prod hesabı → SERİLEŞTİR (eşzamanlı login/oturum yok). ADR-0026 §risk.
      max-parallel: 1
      matrix:
        finding: ${{ fromJSON(needs.evidence-plan.outputs.findings) }}
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      # Production read-only. Mutation kaçış bayrağı YOK.
      ALLOW_MUTATING_TESTS: 'false'
      # Bounded: bulgu başına tek worker + retry storm YOK (report:bug zaten böyle koşar;
      # burada job düzeyinde de sabitlenir).
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_RETRIES: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kısa SHA
        id: vars
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Forensik koşu + güvenli kanıt paketi (tek bulgu)
        # report:bug forensik modda tek testi koşar, YALNIZ güvenli upload bundle üretir.
        # Test kırmızı olsa da araç exit 0; yalnız güvensiz/beklenmeyen dosyada exit 1.
        run: npm run report:bug -- "${{ matrix.finding }}"
      - name: Registry değişmedi mi (forensik registrye YAZMAZ)
        run: git diff --exit-code -- tests/contracts/known-bugs.js
      - name: Güvenli kanıt bundle'ı yükle (YALNIZ upload/ allowlist bundlei)
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle-${{ matrix.finding }}-${{ steps.vars.outputs.short }}-${{ github.run_id }}
          path: test-results/findings/${{ matrix.finding }}/upload/
          if-no-files-found: error
          # ADR-0026 §5: kanıt artifact'i ≥30 gün; evidence-index.json expiry ile hizalı.
          retention-days: 30

  known-bug-evidence-index:
    name: Evidence index (evidence-index.json üret + yükle)
    needs: [evidence-plan, known-bug-evidence]
    # Matris hücreleri kısmen kırmızı olsa da (flaky/infra) index kalan kanıtlardan
    # üretilir; bu yüzden always(). Hiç bulgu yoksa atlanır.
    if: ${{ always() && needs.evidence-plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kanıt bundle'larını indir (aynı koşum artifact'leri)
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-bundle-*
          path: test-results/evidence-download
      - name: Yakalama anı (provenance enjeksiyonu — üreteç Date.now KULLANMAZ)
        id: cap
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: evidence-index.json üret (runUrl/capturedAt/expiry CI'dan enjekte)
        env:
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_COMMIT: ${{ github.sha }}
          EVIDENCE_CAPTURED_AT: ${{ steps.cap.outputs.at }}
          # Artifact retention (30g) ile hizalı expiry (ADR-0026 §5).
          EVIDENCE_RETENTION_DAYS: '30'
        run: node tools/generate-evidence-index.mjs --bundles test-results/evidence-download
      - name: Kanıt index güvenli bundle hazırla (known-bug-evidence lane)
        id: prep_evidence
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane known-bug-evidence
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Kanıt index'i yükle (COMMIT önerisi; YALNIZ prepared bundle)
        # evidence-index.json COMMIT'lenir (ADR §4); bu artifact maintainer'ın commit'i
        # için güvenli kopyayı taşır (schedule → main'e otomatik push YOK; read-only ethos).
        if: ${{ !cancelled() && steps.prep_evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-evidence-index-${{ github.run_id }}
          path: test-results/secure-upload/known-bug-evidence/
          if-no-files-found: error
          retention-days: 30

  # ── Rol-scoped RBAC enforcement (CI orphan çözümü / COV-01, ADR-0030) ──────────
  # `*.{admin,supervisor,agent}.spec.js` yalnız `chromium-<role>` projesinde koşar;
  # bu proje ancak VOMENTA_<ROLE>_EMAIL/PASSWORD tanımlıysa oluşur. Hiçbir lane bu
  # projeleri hedeflemediğinden spec'ler CI'da HİÇ koşmuyordu. Bu job o boşluğu kapatır:
  # tools/run-role-enforcement.mjs credential'lı rolleri DİNAMİK koşar; credential yoksa
  # GÖRÜNÜR skip + exit 0 (fail-closed). NON-REQUIRED (schedule/dispatch) → PR'ları
  # kilitlemez; credential secret'ları gelince otomatik gerçek koşuma döner.
  role-enforcement:
    name: Role-scoped RBAC enforcement
    needs: architecture
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOMENTA_ADMIN_EMAIL: ${{ secrets.VOMENTA_ADMIN_EMAIL }}
      VOMENTA_ADMIN_PASSWORD: ${{ secrets.VOMENTA_ADMIN_PASSWORD }}
      VOMENTA_SUPERVISOR_EMAIL: ${{ secrets.VOMENTA_SUPERVISOR_EMAIL }}
      VOMENTA_SUPERVISOR_PASSWORD: ${{ secrets.VOMENTA_SUPERVISOR_PASSWORD }}
      VOMENTA_AGENT_EMAIL: ${{ secrets.VOMENTA_AGENT_EMAIL }}
      VOMENTA_AGENT_PASSWORD: ${{ secrets.VOMENTA_AGENT_PASSWORD }}
      VOMENTA_AGENT_FORBIDDEN_ENDPOINT: ${{ vars.VOMENTA_AGENT_FORBIDDEN_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rol-scoped enforcement (credential yoksa görünür skip; fail-closed)
        run: node tools/run-role-enforcement.mjs
