# FAZ 2 (workflow split) — Haftalık Firefox + WebKit cross-browser regression.
# playwright.yml full-regression'ından ayrıldı; Chromium günlük (nightly-functional),
# Firefox/WebKit haftalık burada. Sıralı çalışma (max-parallel:1) + per-browser install
# Faz 6'da uygulanacak. Bu fazda yalnız taşıma + sorumluluk sınırı + production kilidi.
name: Weekly Cross Browser

on:
  schedule:
    # Haftada bir, Cumartesi 02:00 UTC. nightly-* ve weekly-visual (Pazar) ile çakışmaz.
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-cross-browser-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_ENV: ${{ vars.E2E_ENV || 'production' }}
  BASE_URL: ${{ vars.E2E_BASE_URL || 'https://app.vomenta.com' }}
  ALLOW_MUTATING_TESTS: 'false'

jobs:
  architecture:
    name: Architecture and test discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality:check

  cross-browser-regression:
    name: Full cross-browser regression
    needs: architecture
    concurrency:
      group: vomenta-production-authenticated-e2e
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # FAZ 2: fail-fast:false browser sonuçlarını ayrı toplamak için. max-parallel:1
      # (sıralı) Faz 6'da eklenecek.
      fail-fast: false
      matrix:
        # FAZ 2: yalnız Firefox + WebKit (Chromium → nightly-functional.yml).
        browser: [firefox-authed, webkit-authed]
        shard: [1, 2]
    env:
      VOMENTA_EMAIL: ${{ secrets.VOMENTA_EMAIL }}
      VOMENTA_PASSWORD: ${{ secrets.VOMENTA_PASSWORD }}
      PLAYWRIGHT_WORKERS: 2
      PLAYWRIGHT_RETRIES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # FAZ 2: install korunur. Faz 6'da hücre başına yalnız kendi engine'i kurulacak.
      - run: npx playwright install --with-deps
      - name: Shard koşumu (tarayıcı × parça; kapsam korunur, retry-pass FLAKY kalır)
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Güvenli artifact bundle hazırla (full-regression)
        id: prep_full
        if: ${{ !cancelled() }}
        run: |
          npm run report:artifact:prepare -- --lane full-regression
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Güvenli artifact yükle (YALNIZ prepared bundle)
        if: ${{ !cancelled() && steps.prep_full.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-secure-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: test-results/secure-upload/full-regression/
          if-no-files-found: error
          retention-days: 30
